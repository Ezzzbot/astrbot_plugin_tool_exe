# 开发者配置：面向维护插件的人，普通用户不需要动这里
#
# WebUI 插件配置页里能改的只有三项：启用开关、接口地址、发送形式。
# 本文件里的值是默认值；如果 WebUI 里存在同名配置项，以 WebUI 为准。
#
# 改完不需要重启 AstrBot，插件页点一下重载即可。

# 所有功能共用的网络参数
network:
  # 单次请求超时（秒）
  timeout: 10
  # 失败重试次数，只有网络错误和超时才会重试，429 / 404 不重试
  retries: 2
  # HTTP 代理，例如 http://127.0.0.1:7890，留空表示直连
  proxy: ""

# 今日新闻
news60s:
  # 数据缓存时长（秒），0 表示每次都请求接口
  cache_seconds: 600
  # 是否显示日期 / 星期 / 农历
  show_meta: true
  # 是否显示每日微语
  show_tip: true
  # 是否显示原文链接
  show_link: true
  # 自定义落款，追加在消息末尾，留空不显示
  footer: ""
